server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reverse-proxy to Coolify API — token stays server-side
    location /api/coolify/ {
        proxy_pass https://cloud.comfyspace.tech/api/v1/;
        proxy_set_header Authorization "Bearer ${COOLIFY_TOKEN}";
        proxy_set_header Accept "application/json";
        proxy_set_header Host cloud.comfyspace.tech;
        proxy_ssl_server_name on;

        # CORS for the SPA
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
